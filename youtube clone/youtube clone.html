<!doctype html>
<html lang="en">

     <!----------------------head------------------------->
  <head>
    <title>YouTube Clone</title>
    <link rel="stylesheet" href="clone css.css" />
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  </head>

        <!----------------------body------------------------->
  <body>

    <!----------------------navbar------------------------->
    <header class="navbar">
<button class="menu-button">&#9776;</button>

 <!----------------------logo and text------------------------->
    <div class="logo">
   <img src="./youtube.png" alt="YouTube Logo"/>
    <span>YouTube</span>
    </div>

    <!----------------------search box------------------------->
    <div class="search-box">

    <input type="text" placeholder="Search">

    <button class="search-btn">
        <i class="fa-solid fa-magnifying-glass"></i>
    </button>

    <button class="mic-btn">
        <i class="fa-solid fa-microphone"></i>
    </button>
</div>

 <!----------------------create bell profile------------------------->
<div class="right">
<button class="create-btn">
        <i class="fa-solid fa-plus"></i>
        Create
    </button>

    <i class="fa-regular fa-bell bell"></i>

    <i class="fa-solid fa-circle-user profile-icon"></i>
</div>
</header>
    

<!----------------------side bar------------------------->
<div class="sidebar">

    <a href="#"><i class="fa-solid fa-house"></i><span>Home</span></a>

    <a href="#"><i class="fa-solid fa-bolt"></i><span>Shorts</span></a>

    <a href="#"><i class="fa-solid fa-play"></i><span>Subscriptions</span></a>

    <hr>

    <h4>You ></h4>

    <a href="#"><i class="fa-regular fa-user"></i><span>Your Channel</span></a>

    <a href="#"><i class="fa-solid fa-clock-rotate-left"></i><span>History</span></a>

    <a href="#"><i class="fa-regular fa-clock"></i><span>Watch Later</span></a>

    <a href="#"><i class="fa-regular fa-thumbs-up"></i><span>Liked Videos</span></a>

    <a href="#"><i class="fa-solid fa-download"></i><span>Downloads</span></a>

</div>
